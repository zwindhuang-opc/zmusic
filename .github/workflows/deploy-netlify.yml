name: Deploy to Netlify

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'netlify/**'
      - 'VERSION.json'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-netlify.yml'
      - 'vite.config.*'
      - 'netlify.toml'
      - 'tailwind.config.*'
      - 'postcss.config.*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir ./dist --functions ./netlify/functions --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --site ${{ secrets.NETLIFY_SITE_ID }} --message "Deploy from GitHub Actions (${{ github.sha }})"
        timeout-minutes: 10
