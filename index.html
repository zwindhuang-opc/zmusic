<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo192.png" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZMusic" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ZMusic - AI Music Generation Platform</title>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      background-color: #0a0a0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Pre-mount splash placeholder — visible until React hydrates.
       This eliminates the "black screen flash" between native splash hide
       and first React paint on mobile/Capacitor builds. */
    #__bootstrap_loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(135deg, #0a0a0f 0%, #0f0a1a 50%, #0a0a0f 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    #__bootstrap_loader .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.35);
      animation: pulse 1.8s ease-in-out infinite;
    }
    #__bootstrap_loader .logo::after {
      content: "";
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.9);
      border-radius: 8px;
    }
    #__bootstrap_loader .title {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa 0%, #f472b6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    #__bootstrap_loader .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #a78bfa;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #__bootstrap_loader .subtitle {
      font-size: 11px;
      color: rgba(156, 163, 175, 0.8);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #__bootstrap_loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.92; }
    }
  </style>
</head>

<body>
  <div id="__bootstrap_loader">
    <div class="logo" aria-hidden="true"></div>
    <div class="title">ZMusic</div>
    <div class="spinner" role="status" aria-label="Loading"></div>
    <div class="subtitle">AI Music Studio · Loading</div>
  </div>
  <div id="root"></div>
  <script>
    // Global bridge: mobile.js (SplashScreen.hide) waits for this event.
    // Set after React mounts + first paint, so splash never hides to a black screen.
    window.__zmusic_dismiss_bootstrap = function () {
      try {
        var el = document.getElementById('__bootstrap_loader');
        if (el) {
          el.classList.add('hidden');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
        }
      } catch (_) {}
      try {
        window.dispatchEvent(new CustomEvent('zmusic:ui-ready'));
      } catch (_) {}
    };
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
