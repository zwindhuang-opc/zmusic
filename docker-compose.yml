version: '3.8'

services:
  zmusic:
    build: .
    container_name: zmusic-app
    ports:
      - "5500:5500"
      - "5501:5501"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://localhost:5501
    volumes:
      - ./data:/app/data
      - ./.history:/app/.history
    restart: unless-stopped